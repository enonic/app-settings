<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 26 26" fill="none"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Addressed by id: an inlined svg's <style> is a document-level stylesheet, so a class name
       here would leak into whatever page embeds the icon. The media query is the only theme signal
       available — an icon fetched as an image cannot see the tool's own theme switch. -->
  <style>
    #settings-tool-glyph { stroke: #1B1B1B }
    @media (prefers-color-scheme: dark) { #settings-tool-glyph { stroke: #FFFFFF } }
  </style>
