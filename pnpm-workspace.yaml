# ! No catalog: Dependabot writes a lockfile that a `catalog:` specifier cannot satisfy —
# dependabot-core#12244 — so the three versions live in package.json, where it updates them
# correctly, and `$name` keeps the overrides on whatever is pinned there.
overrides:
  vite: '$vite'
  vitest: '$vitest'
# react/react-dom are aliased to preact/compat, so never install the real
# packages when a lib (e.g. @tanstack/react-router) declares them as peers.
autoInstallPeers: false
peerDependencyRules:
  # react/react-dom are aliased to preact/compat in vite.config.ts + tsconfig,
  # so the actual packages aren't installed; ignore libs' react peer demands.
  allowAny:
    - vite
    - react
    - react-dom
  allowedVersions:
    vite: '*'
minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@enonic-types/*'
  - '@enonic/ui'
