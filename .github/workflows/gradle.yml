name: Gradle Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  publish_vars:
    runs-on: ubuntu-latest

    outputs:
      publish: ${{ steps.publish_vars.outputs.release != 'true' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/8.')) }}
      repo: ${{ steps.publish_vars.outputs.repo }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get publishing variables
        id: publish_vars
        uses: enonic/release-tools/publish-vars@6b86542c83b7d59b193441663c7381f4c5e2f2ff # master @ 2026-07-01
        env:
          PROPERTIES_PATH: './gradle.properties'

  build:
    runs-on: ubuntu-latest

    needs: publish_vars

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Prepare Gradle arguments
        run: |
          ARGS='--refresh-dependencies build'
          if [ "${{ needs.publish_vars.outputs.publish }}" = 'true' ]; then
            ARGS="$ARGS publish -Pcom.enonic.xp.app.production=true -PrepoKey=${{ needs.publish_vars.outputs.repo }} -PrepoUser=ci"
          fi
          echo "GRADLE_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew $GRADLE_ARGS
        env:
          ORG_GRADLE_PROJECT_repoPassword: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-settings
          path: build/libs/app-settings.jar
          if-no-files-found: error

  dispatch:
    runs-on: ubuntu-latest

    needs: [publish_vars, build]

    if: needs.publish_vars.outputs.publish == 'true'

    steps:
      - name: Rebuild the distribution
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repo: enonic/xp-distro
          workflow: gradle.yml
