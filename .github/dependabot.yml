version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Keep in sync with minimumReleaseAge/minimumReleaseAgeExclude in
    # pnpm-workspace.yaml: Dependabot must not propose versions pnpm would reject,
    # and must not hold back the first-party packages pnpm lets through.
    cooldown:
      default-days: 4
      exclude:
        - '@enonic-types/*'
        - '@enonic/ui'
    groups:
      enonic:
        patterns:
          - '@enonic/*'
          - '@enonic-types/*'
      ui-runtime:
        patterns:
          - '@radix-ui/*'
          - 'focus-trap-react'
          - 'lucide-react'
          - 'preact'
      nanostores:
        patterns:
          - 'nanostores'
          - '@nanostores/*'
      vite:
        patterns:
          - 'vite'
          - 'vite-plus'
          - 'vitest'
          - '@vitest/*'
          # `vite` is an alias for the vite-plus core build, which has to move with it — but
          # Dependabot only bumps `vite-plus`: it does not rewrite `npm:` specifiers, so
          # grouping cannot keep the two in step. A mismatch fails the build with "Cannot
          # find native binding", so bump the alias to match by hand on these PRs.
          - '@voidzero-dev/*'
      tailwindcss:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tw-animate-css'
      types:
        patterns:
          - '@types/*'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    assignees:
      - 'ashklianko'

  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    assignees:
      - 'ashklianko'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    assignees:
      - 'ashklianko'
